name: Agenda de revisión editorial

# Convierte las fechas públicas de monitoreo en tareas accionables. El chequeo
# abre un issue una sola vez por frente/fecha y avisa por Telegram; nunca cambia
# el catálogo ni registra automáticamente una revisión "sin cambios".

on:
  schedule:
    # Días hábiles a las 13:00 UTC (07:00 CR). La ventana anticipa 7 días.
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check monitoring due dates
        run: npm run check-monitoring-due

      - name: Open editorial review issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run create-monitoring-review-issue

      - name: Upload agenda artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-agenda-${{ github.run_id }}
          path: scraper-runs/monitoring-due.json
          retention-days: 30
